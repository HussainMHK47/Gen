<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Workshop Ticket Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0393f9 0%, #a1ffa4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        h2 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #2d3748;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(118, 75, 162, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 14px rgba(118, 75, 162, 0.35);
        }
        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Workshop Entry</h2>
    <div class="subtitle">Secure your seat for the upcoming technical sessions</div>
    <form id="bookingForm">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="workshop">Select Workshop</label>
            <select id="workshop" required>
                <option value="">-- Choose a Topic --</option>
                <option value="web-dev">Full Stack Web Development</option>
                <option value="ai-ml">Artificial Intelligence & Machine Learning</option>
                <option value="cybersecurity">Cybersecurity Essentials</option>
            </select>
        </div>
        <div class="form-group">
            <label for="ticketCount">Number of Sessions</label>
            <input type="number" id="ticketCount" min="1" max="5" value="1" required>
        </div>
        <button type="submit">Book Sessions</button>
    </form>
</div>

<script>
    const form = document.getElementById('bookingForm');
    const fields = ['fullName', 'studentId', 'email', 'workshop', 'ticketCount'];

    fields.forEach(field => {
        const input = document.getElementById(field);
        input.value = sessionStorage.getItem(field) || input.value;
        input.addEventListener('input', () => {
            sessionStorage.setItem(field, input.value);
        });
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const booking = {};
        fields.forEach(f => { booking[f] = document.getElementById(f).value; });

        const currentBookings = JSON.parse(localStorage.getItem('workshopBookings') || '[]');
        currentBookings.push(booking);
        localStorage.setItem('workshopBookings', JSON.stringify(currentBookings));

        form.reset();
        fields.forEach(f => sessionStorage.removeItem(f));
        alert('Booking successful!');
    });
</script>

</body>
</html>
