<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About My City</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #ff0000;
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
       
        h1 {
            font-family: 'Fredoka One', cursive;
            color: #fdfdfc;
            font-size: 4.5rem;
            text-align: center;
            margin: 0 0 40px 0;
            text-shadow: 
                4px 4px 0px #000,
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
            letter-spacing: 2px;
            transform: rotate(-2deg);
        }

        .landmarks-container {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 12px 12px 0px #000000;
            margin-bottom: 50px;
            box-sizing: border-box;
        }

        h2 {
            font-family: 'Fredoka One', cursive;
            color: #000;
            font-size: 2rem;
            margin-top: 0;
            border-bottom: 4px dashed #000;
            padding-bottom: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 25px 0;
            padding: 15px;
            border: 3px solid #000;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            box-shadow: 5px 5px 0px #000;
            transition: transform 0.1s ease;
        }

        li:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #000;
        }
       
        .landmark-1 {
            background-color: #00ddff;
            color: #ff0000;
            font-family: 'Georgia', serif;
            font-size: 1.6rem;
            font-style: italic;
        }
        
        .landmark-2 {
            background-color: #35ffe1;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
       
        .landmark-college {
            background-color: #ddffa1;
            padding: 0;
            overflow: hidden;
        }

        .landmark-college a {
            display: block;
            padding: 15px;
            color: #ff0000;
            font-family: 'Impact', Charcoal, sans-serif;
            font-size: 1.8rem;
            text-decoration: underline;
        }

        .landmark-college a:hover {
            color: #fff;
            background-color: #ec971f;
        }
      
        .landmark-4 {
            background-color: #6f42c1;
            color: #fff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 1.5rem;
            transform: rotate(1deg);
        }
       
        .marquee-container {
            width: 100%;
            background-color: #e9ecef;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            overflow: hidden;
            padding: 15px 0;
            transform: rotate(-1deg);
            max-width: 640px;
            box-sizing: border-box;
        }

        marquee {
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Nagpur</h1>

    <div class="landmarks-container">
        <h2>Key Landmarks</h2>
        <ul>
            <li class="landmark-1">VR Mall</li>
            <li class="landmark-2">Futala Lake</li>
            <li class="landmark-college">
                <a href="https://sitnagpur.edu.in/" target="_blank">Symbiosis institute of technology, Nagpur</a>
            </li>
            <li class="landmark-4">Ambora Dam</li>
        </ul>
    </div>

    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            Advice of the day: Always keep learning, stay curious, and explore the hidden gems of your city!
        </marquee>
    </div>

</body>
</html>
